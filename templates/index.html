{% extends "base.html" %}{% block content %}<section class="panel"><h2>All posts</h2>{% for p in paginator.pages %}<article class="post"><h2><a href="{{ p.permalink }}">{{ p.title }}</a></h2><p class="meta"><time datetime="{{ p.date }}">{{ p.date | date(format="%Y-%m-%d") }}</time></p>{% for tag in p.taxonomies.tags %}<a class="tag" href="{{ get_taxonomy_url(kind='tags', name=tag) }}"># {{ tag }}</a>{% endfor %}</article>{% endfor %}{% include "pagination.html" %}</section>{% endblock %}

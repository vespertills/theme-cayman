name: Install Aster Notes for Cloudflare once more

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Unpack theme files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd()
          with ZipFile('site.zip') as archive:
              for member in archive.infolist():
                  path = Path(member.filename)

                  if (member.is_dir() or path.is_absolute()
                      or '..' in path.parts or path.parts[0] == '.git'):
                      raise SystemExit('Invalid package entry')

                  # Workflow files must be created manually on GitHub.
                  if path.parts[:2] == ('.github', 'workflows'):
                      continue

                  destination = root / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(member))

          Path('site.zip').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Aster Notes'
          git push
